name: CI

on:
  push:
    branches:
      - main
      - 'phase-1/**'
      - 'phase-2/**'
      - 'phase-3/**'
      - 'phase-4/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Resolve npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Format source and configuration
        run: npm run format

      - name: Commit generated lockfile and formatting
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$PR_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: format sources and lock dependencies"
              git pull --rebase origin "$TARGET_BRANCH"
              git push origin "HEAD:$TARGET_BRANCH"
            fi
          fi

      - name: Check formatting
        run: npm run lint

      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2)); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ': ' + item.severity + ' | fix=' + JSON.stringify(item.fixAvailable));"

      - name: Run unit tests
        run: npm test

      - name: Build production web app
        run: npm run build:production

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps chromium firefox

      - name: Start audio server for Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1

      - name: Initialize or verify Playwright visual baseline
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          SNAPSHOT_DIR="e2e/app.spec.ts-snapshots"
          SNAPSHOT_FILE="$SNAPSHOT_DIR/saituno-tuner-interface-chromium-linux.png"
          if [ -f e2e/UPDATE_VISUAL_BASELINES ]; then
            npm run test:e2e -- --update-snapshots
            rm e2e/UPDATE_VISUAL_BASELINES
            if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$PR_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+users.noreply.github.com"
              git add "$SNAPSHOT_DIR" e2e/UPDATE_VISUAL_BASELINES
              git commit -m "test: update Phase 4 tuner visual baseline"
              git pull --rebase origin "$TARGET_BRANCH"
              git push origin "HEAD:$TARGET_BRANCH"
            fi
          elif [ ! -f "$SNAPSHOT_FILE" ]; then
            npm run test:e2e -- --update-snapshots
            if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$PR_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+users.noreply.github.com"
              git add "$SNAPSHOT_DIR"
              if ! git diff --cached --quiet; then
                git commit -m "test: add Phase 4 visual regression baseline"
                git pull --rebase origin "$TARGET_BRANCH"
                git push origin "HEAD:$TARGET_BRANCH"
              fi
            fi
          fi
          npm run test:e2e
