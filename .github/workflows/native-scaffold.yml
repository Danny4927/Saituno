name: Initialize native projects

on:
  push:
    branches:
      - 'phase-1/**'
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'src/**'
      - '.github/workflows/native-scaffold.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'src/**'
      - '.github/workflows/native-scaffold.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-scaffold-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Generate Android and iOS projects
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install

      - name: Build web assets for Capacitor
        run: npm run build:native

      - name: Generate native platform projects
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync

      - name: Commit generated native projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios
          if ! git diff --cached --quiet; then
            git commit -m "chore: initialize Capacitor Android and iOS projects"
            git pull --rebase origin "${{ github.head_ref || github.ref_name }}"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
